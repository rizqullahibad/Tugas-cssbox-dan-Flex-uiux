
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box 2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px 2%;
            background-color: white;
        }

        /* Layout utama */
        .container {
            width: 100%;
            height: calc(100vh - 20px);

            display: grid;
            grid-template-columns: 20% 1fr;
            grid-template-rows: 20% 1fr 1fr;

            column-gap: 4.5%;
            row-gap: 4%;
        }

        /* Kotak hijau bagian atas */
        .header {
            background-color: #addd98;
            border: 2px solid #333;
            grid-column: 1 / 3;
            grid-row: 1;
        }

        /* Kotak kuning */
        .sidebar {
            background-color: #f5eb45;
            border: 2px solid #333;
            grid-column: 1;
        }

        /* Kotak oranye */
        .orange {
            background-color: #ff6426;
            border: 2px solid #333;
            grid-column: 2;
            grid-row: 2;
        }

        /* Kotak biru */
        .blue {
            background-color: #43c9e8;
            border: 2px solid #333;
            grid-column: 2;
            grid-row: 3;
        }

        /* Penempatan kotak kuning */
        .yellow-top {
            grid-row: 2;
        }

        .yellow-bottom {
            grid-row: 3;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="header"></div>

        <div class="sidebar yellow-top"></div>

        <div class="orange"></div>

        <div class="sidebar yellow-bottom"></div>

        <div class="blue"></div>

    </div>

</body>
</html>
