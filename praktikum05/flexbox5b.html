
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            background-color: #ffb6b9;
            font-family: Arial, sans-serif;
        }

        /* Layout utama */
        .container {
            width: 100%;
            height: calc(100vh - 20px);

            display: grid;
            grid-template-columns: 28% 1fr;
            grid-template-rows: 12% 1fr 12%;
            gap: 12px 16px;
        }

        /* Header */
        .header {
            background-color: #91cfc7;
            grid-column: 1 / 3;
            grid-row: 1;
        }

        /* Aside */
        .aside {
            background-color: #60b5b3;
            grid-column: 1;
            grid-row: 2;
        }

        /* Article */
        .article {
            background-color: #fa777b;
            grid-column: 2;
            grid-row: 2;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 12px;
        }

        /* Judul Article */
        .article h3 {
            color: white;
            font-size: 18px;
            margin: 0 0 15px 0;
        }

        /* Bagian gambar */
        .images {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .image {
            height: 100px;
            background-color: #d5d5d5;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
        }

        /* Footer */
        .footer {
            background-color: #91cfc7;
            grid-column: 1 / 3;
            grid-row: 3;
        }

        /* Tulisan Header, Aside, dan Footer */
        .header,
        .aside,
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            Header
        </div>

        <div class="aside">
            Aside
        </div>

        <div class="article">

            <h3>Article</h3>

            <div class="images">
                <div class="image">Image</div>
                <div class="image">Image</div>
                <div class="image">Image</div>
            </div>

        </div>

        <div class="footer">
            Footer
        </div>

    </div>

</body>
</html>
